# [tur3b 2026-10-22] Üç işletim sisteminde: kur -> veri indir + SHA-256 -> testler -> provayı beyin yeniden koşusuyla
# [tur4 2026-10-23] Prova artık PROVA9B (tur3b kodu, seçenek B). Olumsuz denemeler sebebini de kontrol eder.
# doğrula -> spike'lar Mac referansıyla bit bit aynı mı? Ayrıca tanı: Brian2 numpy hedefiyle aynı mı, süreler.
name: dogrulama

on:
  push:
  workflow_dispatch:
    # [tur4 2026-10-23] Final dosyaları depoda: elle tetiklenir (gh workflow run dogrulama
    # -f kod=... -f duyuru_sha=... -f yayin_utc=...). Boş bırakılırsa yalnız prova doğrulanır.
    # [tur5 2026-11-02] Üç değerin kaynağı Bölüm 1 reel'inin altındaki Instagram yorumu.
    inputs:
      kod:
        description: "FINAL: Bölüm 1 reel'inin altındaki yorumdaki TAM 64 karakter taahhüt SHA-256"
        required: false
        default: ""
      duyuru_sha:
        description: "FINAL: aynı yorumdaki duyuru özeti (Kurallar + kod özeti)"
        required: false
        default: ""
      yayin_utc:
        description: "FINAL: yorumun saati, taahhüdün açıkta ilk görüldüğü an (UTC, ör. 2026-10-23T03:50:00Z)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  dogrula:
    name: ${{ matrix.ad }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        # boşluklu ve Türkçe karakterli yol: Windows'taki yol tuzaklarını da dener
        working-directory: "sinek deneme ç"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ad: windows
            bpy: beyin/.venv/Scripts/python.exe
          - os: macos-latest
            ad: macos
            bpy: beyin/.venv/bin/python
          - os: ubuntu-latest
            ad: linux
            bpy: beyin/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: "sinek deneme ç"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: ortam bilgisi (satır sonu ayarı dahil)
        shell: bash
        run: |
          python -c "import platform,sys,locale;print(platform.platform(), sys.version, 'locale:', locale.getpreferredencoding(False))"
          node --version
          echo "git core.autocrlf = $(git config --get core.autocrlf || echo yok)"
          echo "çalışma klasörü: $PWD"
          mkdir -p ci_cikti

      # README'deki komutların aynısı (Windows'ta PowerShell, ötekilerde bash)
      - name: "1) kur"
        run: python -I araclar/kur.py

      - name: "2) veri indir + SHA-256"
        run: python -I araclar/veri_indir.py

      - name: "3) testler"
        run: python -I araclar/testler.py

      - name: "4) doğrula: PROVA9B, beyin yeniden koşusu dahil"
        id: dogrula
        continue-on-error: true
        run: python -I araclar/dogrula.py --beklenen prova --cikti ci_cikti/verify_${{ matrix.ad }}.txt --json ci_cikti/dogrula_${{ matrix.ad }}.json

      # [tur5 2026-11-02] README ve sayfadaki komutların aynısı, işletim sistemine göre iki biçimde: macOS/Linux bash
      # (\ ile satır bölme, düz bölü), Windows PowerShell (` ile satır bölme, ters bölü). Önce bağımsız JS kontrolü.
      - name: "4b) FINAL doğrula, bash (yalnız elle tetiklenince, kod verildiyse)"
        id: final
        if: always() && github.event_name == 'workflow_dispatch' && inputs.kod != '' && runner.os != 'Windows'
        shell: bash
        env:
          KOD: ${{ inputs.kod }}
          DUYURU: ${{ inputs.duyuru_sha }}
          YAYIN: ${{ inputs.yayin_utc }}
        run: |
          node oyun/bagimsiz/kontrol.mjs veri/beacon.json veri/taahhut.json veri/penalty_log.json veri/beyin_kararlari.json \
            > ci_cikti/final_js_${{ matrix.ad }}.txt
          grep -q "BAĞIMSIZ KONTROL: TUTUYOR" ci_cikti/final_js_${{ matrix.ad }}.txt
          python -I araclar/dogrula.py --taahhut veri/taahhut.json --config oyun/config_final.json \
            --log veri/penalty_log.json --karar veri/beyin_kararlari.json --beacon-dosya veri/beacon.json \
            --kod "$KOD" --duyuru-sha "$DUYURU" --yayin-utc "$YAYIN" --beklenen final \
            --cikti ci_cikti/final_verify_${{ matrix.ad }}.txt --json ci_cikti/final_${{ matrix.ad }}.json

      - name: "4b) FINAL doğrula, PowerShell (yalnız elle tetiklenince, kod verildiyse)"
        id: final_win
        if: always() && github.event_name == 'workflow_dispatch' && inputs.kod != '' && runner.os == 'Windows'
        shell: pwsh
        env:
          KOD: ${{ inputs.kod }}
          DUYURU: ${{ inputs.duyuru_sha }}
          YAYIN: ${{ inputs.yayin_utc }}
        run: |
          node oyun\bagimsiz\kontrol.mjs veri\beacon.json veri\taahhut.json veri\penalty_log.json veri\beyin_kararlari.json | Out-File -Encoding utf8 ci_cikti\final_js_${{ matrix.ad }}.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I araclar\dogrula.py --taahhut veri\taahhut.json --config oyun\config_final.json `
            --log veri\penalty_log.json --karar veri\beyin_kararlari.json --beacon-dosya veri\beacon.json `
            --kod "$env:KOD" --duyuru-sha "$env:DUYURU" --yayin-utc "$env:YAYIN" --beklenen final `
            --cikti ci_cikti\final_verify_${{ matrix.ad }}.txt --json ci_cikti\final_${{ matrix.ad }}.json

      - name: "tanı: cython hedefi (beyin_model.py'nin seçimi), süre ve ilk fark"
        if: always()
        continue-on-error: true
        shell: bash
        run: '"${{ matrix.bpy }}" -I -B araclar/beyin_hedef_olcum.py --hedef degistirme --json ci_cikti/hedef_cython_${{ matrix.ad }}.json'

      - name: "tanı: numpy hedefi (derleyicisiz), Mac'e göre aynı mı ve süre"
        if: always()
        continue-on-error: true
        shell: bash
        run: '"${{ matrix.bpy }}" -I -B araclar/beyin_hedef_olcum.py --hedef numpy --json ci_cikti/hedef_numpy_${{ matrix.ad }}.json'

      - name: "olumsuz deneme: derleyici yokken (beklenen: DOĞRULANAMADI, sessiz geçiş yok)"
        if: always() && runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        env:
          CC: /bin/false
          CXX: /bin/false
          CYTHON_CACHE_DIR: ${{ runner.temp }}/bos_cython_onbellek
        run: |
          set +e
          python -I araclar/dogrula.py --cikti ci_cikti/negatif_${{ matrix.ad }}.txt --json ci_cikti/negatif_${{ matrix.ad }}.json
          kod=$?
          echo "verify çıkış kodu: $kod (1 = DOĞRULANAMADI beklenir)"
          # [tur4 2026-10-23] doğru sebepten mi düştü? (derleme komutu hata verdi; çıktıdaki çift
          # brian_extensions/…/brian_extensions/ yolu setuptools'un normal ara dosya adı, sebep değil)
          grep -q "_cython_magic_.*returned non-zero exit status" ci_cikti/negatif_${{ matrix.ad }}.txt
          sebep=$?
          echo "sebep derleme mi: $sebep (0 = evet)"
          test "$kod" = "1" && test "$sebep" = "0"

      - name: "benzetim: Türkçe 8-bit yerel ayar (ISO-8859-9, Windows cp1254 gibi 'ş' = 0xFE): kalkansız düşer, varsayılan dogrula.py geçer"
        if: always() && runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          sudo localedef -i tr_TR -f ISO-8859-9 tr_TR.ISO-8859-9
          export LC_ALL=tr_TR.ISO-8859-9
          beyin/.venv/bin/python -I -c "import locale,sys;print('alt süreç kodlaması:', locale.getpreferredencoding(False), sys.stderr.encoding)"
          set +e
          # [tur4 2026-10-23] 1) kalkan bilerek kapalı (düz venv python) 2) README'deki komutun aynısı: dogrula.py
          # kalkanı (beyin/.venv/bin/python_utf8) kendisi kullanır
          python -I araclar/dogrula.py --beyin-python "$PWD/beyin/.venv/bin/python" --cikti ci_cikti/latin5_kalkansiz_${{ matrix.ad }}.txt --json ci_cikti/latin5_kalkansiz_${{ matrix.ad }}.json > /dev/null
          k1=$?
          python -I araclar/dogrula.py --cikti ci_cikti/latin5_kalkanli_${{ matrix.ad }}.txt --json ci_cikti/latin5_kalkanli_${{ matrix.ad }}.json > /dev/null
          k2=$?
          grep -h "beyin yeniden koşusu başarısız\|SONUÇ:" ci_cikti/latin5_kalkansiz_${{ matrix.ad }}.txt ci_cikti/latin5_kalkanli_${{ matrix.ad }}.txt
          echo "kalkansız (düz python) çıkış $k1 (beklenen 1: DOĞRULANAMADI) | varsayılan dogrula.py (python_utf8) çıkış $k2 (beklenen 3: PROVA DOĞRULANDI)"
          test "$k1" = "1" && test "$k2" = "3"

      - name: özet
        if: always()
        shell: bash
        run: python araclar/ci_ozet.py ci_cikti >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci_cikti_${{ matrix.ad }}
          path: "sinek deneme ç/ci_cikti/"
          retention-days: 30

      - name: sonuç (doğrulama tutmadıysa iş KIRMIZI)
        if: always() && steps.dogrula.outcome != 'success'
        shell: bash
        run: |
          echo "doğrulama beklenen sonucu vermedi: PROVA DOĞRULANDI + 5/5 bit bit aynı DEĞİL"
          exit 1

  ozet:
    needs: dogrula
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: ci_cikti
      - name: üç işletim sistemi yan yana
        run: python3 araclar/ci_ozet.py ci_cikti >> "$GITHUB_STEP_SUMMARY"
